    <script>
        $(function(){
            $('.drag-1').draggable({ 
                revert: "invalid"
            });
    
            $('.drop-1').droppable({
                hoverClass: 'active',
                drop: function(e, ui){
                    $(ui.draggable).css({ 
                        top: "0", 
                        left: "0",
                        position: "relative" 
                    }).appendTo($(this)); 
                }
            });
        });
    
        function verifica() {
            let conta = 0; 
    
            $('.drop-1').each(function() {
                let drop = $(this);
                let dropId = drop.attr("id"); 
                let lastNum = dropId ? dropId.match(/\d+$/) : null;
    
                if (lastNum) {
                    let dragNum = drop.find('.drag-1 p').text(); 
                    if (dragNum == lastNum[0]) {
                        drop.css("background-color", "lightgreen");
                        conta++; 
                    } else {
                        drop.css("background-color", "lightcoral"); 
                    }
                }
            });
    
            if(conta === 57){
                setTimeout(() => {
                    alert("Parabéns! Você concluiu o nível difícil.");
                    window.location.href = "index.html"; 
                }, 500); 
            }
        }
    </script>
